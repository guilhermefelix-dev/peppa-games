<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na comunidade Peppa Games">
    <title>Criar conta — Peppa Games</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/cadastro.js" defer></script>
  </head>

  <body>
    <main class="pagina-login">
      <section class="cartao-login" aria-labelledby="titulo-cadastro">
        <p class="marca">Peppa Games</p>
        <h1 id="titulo-cadastro">Criar conta</h1>
        <p class="subtitulo">Entre para a comunidade e comece a avaliar, comentar e compartilhar dicas.</p>

        <form id="form-cadastro" method="post">
          <div>
            <label for="usuario">Nome de usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Como quer ser chamado" minlength="3" maxlength="30" autocomplete="username" required>
          </div>

          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
          </div>

          <div>
            <label for="senha">Senha</label>
            <div class="campo-senha">
              <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" autocomplete="new-password" required>
              <button type="button" id="mostrar-senha" class="mostrar-senha" aria-pressed="false">Mostrar</button>
            </div>
          </div>

          <div>
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Digite a senha de novo" minlength="6" autocomplete="new-password" required>
          </div>

          <div class="opcoes-login">
            <span>
              <input type="checkbox" id="termos" name="termos" required>
              <label for="termos">Li e aceito os termos de uso</label>
            </span>
          </div>

          <button type="submit">Criar conta</button>

          <p id="aviso-cadastro" class="aviso" role="status" aria-live="polite"></p>
        </form>

        <p class="rodape-login">Já tem conta? <a href="login.html">Entrar</a></p>
      </section>
    </main>
  </body>
</html>
