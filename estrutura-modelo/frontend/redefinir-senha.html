<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha — Peppa Games</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/auth-comum.js" defer></script>
    <script src="js/redefinir-senha.js" defer></script>
  </head>

  <body>
    <main class="pagina-login">
      <section class="cartao-login" aria-labelledby="titulo-login">
        <p class="marca">Peppa Games</p>
        <h1 id="titulo-login">Criar nova senha</h1>
        <p class="subtitulo">Escolha uma nova senha para a sua conta.</p>

        <form id="form-redefinir" method="post">
          <div>
            <label for="senha">Nova senha</label>
            <div class="campo-senha">
              <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
              <button type="button" class="mostrar-senha" aria-pressed="false">Mostrar</button>
            </div>
          </div>
          <div>
            <label for="confirmar">Confirmar nova senha</label>
            <div class="campo-senha">
              <input type="password" id="confirmar" placeholder="Repita a senha" minlength="6" autocomplete="new-password" required>
              <button type="button" class="mostrar-senha" aria-pressed="false">Mostrar</button>
            </div>
          </div>
          <button type="submit">Salvar nova senha</button>
          <p id="aviso-redefinir" class="aviso" role="status" aria-live="polite"></p>
        </form>

        <p class="rodape-login"><a href="login.html">Voltar para o login</a></p>
      </section>
    </main>
  </body>
</html>
